[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "superagent-build"
version = "0.3.1"
description = "A measurable Super Agent kernel: two-stage admission, outbox delivery triangle, ticket persistence, write-scope governance, watchdog review, proactivity threshold, tick scheduler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liu Zewen" }]
keywords = ["agent", "multi-agent", "admission", "outbox", "governance", "watchdog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # 纯 stdlib 内核，零依赖

[project.optional-dependencies]
openai = []  # openai_executor/assessor 用 urllib，无需 SDK

[tool.setuptools]
packages = ["agent"]
